services:
  homebase-backend:
    build: ./backend
    container_name: homebase-tv-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOMEBASE_PORT:-8770}:8770"
    volumes:
      # Synology Container Manager won't create this; run `mkdir -p data` before the first `up`.
      - ./data:/data
